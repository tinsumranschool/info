<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบันทึกการมาเรียนบ้านถิ่น</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { font-family: 'Sarabun', sans-serif; }
body { background: #f0f2f5; margin: 0; }
.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a5f 0%, #2c5282 100%); padding: 20px; }
.login-card { background: #fff; border-radius: 16px; padding: 36px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.login-logo { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #4299e1, #2b6cb0); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; }
.sidebar { width: 250px; min-height: 100vh; background: #1e3a5f; color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform .3s; }
.sidebar-brand { padding: 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar-brand i { font-size: 1.8rem; color: #63b3ed; }
.sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
.sidebar-nav a { color: #cbd5e0; padding: 12px 20px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: .95rem; transition: .2s; }
.sidebar-nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
.sidebar-nav a.active { background: #2c5282; color: #fff; border-left: 3px solid #63b3ed; }
.sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,.1); }
.user-box { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.user-avatar { font-size: 2rem; color: #63b3ed; }
.main-content { margin-left: 250px; flex: 1; min-height: 100vh; }
.topbar { background: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05); position: sticky; top: 0; z-index: 50; }
.content-area { padding: 24px; }
.card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.card-header { background: #fff; border-bottom: 1px solid #edf2f7; font-weight: 600; }
.stat-card { padding: 20px; border-radius: 12px; color: #fff; }
.stat-card h3 { font-size: 2rem; margin: 0; }
.stat-blue { background: linear-gradient(135deg, #4299e1, #2b6cb0); }
.stat-green { background: linear-gradient(135deg, #48bb78, #2f855a); }
.stat-orange { background: linear-gradient(135deg, #ed8936, #c05621); }
.stat-red { background: linear-gradient(135deg, #f56565, #c53030); }
.stat-purple { background: linear-gradient(135deg, #9f7aea, #6b46c1); }
.status-badge { display: inline-block; width: 40px; height: 40px; line-height: 40px; text-align: center; border-radius: 10px; font-weight: 600; cursor: pointer; user-select: none; transition: .2s; border: 2px solid transparent; }
.status-badge:hover { transform: scale(1.08); }
.status-badge.active { border-color: #2d3748; box-shadow: 0 0 0 3px rgba(45,55,72,.15); }
.sb-ข { background: #c6f6d5; color: #22543d; }
.sb-ล { background: #fefcbf; color: #744210; }
.sb-ม { background: #fed7d7; color: #742a2a; }
.sb-ป { background: #e2e8f0; color: #2d3748; }
.table th { background: #f7fafc; font-weight: 600; font-size: .9rem; }
.table td { vertical-align: middle; font-size: .9rem; }
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .content-area { padding: 16px; }
}
@media print {
  .sidebar, .topbar, .no-print { display: none !important; }
  .main-content { margin-left: 0; }
}
</style>
</head>
<body>

<div id="loading" class="loading-overlay d-none">
  <div class="spinner-border text-primary" role="status"></div>
</div>

<div id="loginPage" class="login-wrapper d-none">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-logo"><i class="bi bi-mortarboard-fill"></i></div>
      <h4 class="mt-3 mb-1">ระบบบันทึกการมาเรียน</h4>
      <p class="text-muted small mb-0">โรงเรียนบ้านถิ่น</p>
    </div>
    <div id="loginError" class="alert alert-danger d-none py-2 small"></div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">ชื่อผู้ใช้</label>
      <input id="loginUsername" class="form-control" placeholder="username" autocomplete="username">
    </div>
    <div class="mb-3">
      <label class="form-label small fw-semibold">รหัสผ่าน</label>
      <input id="loginPassword" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" onkeypress="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary w-100 py-2" onclick="doLogin()">
      <i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ
    </button>
  </div>
</div>

<div id="appPage" class="d-none">
  <div class="d-flex">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <i class="bi bi-mortarboard-fill"></i>
        <div><div class="fw-bold">บ้านถิ่น</div><small class="opacity-75">ระบบการมาเรียน</small></div>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" data-page="dashboard"><i class="bi bi-speedometer2"></i> แดชบอร์ด</a>
        <a href="#attendance" data-page="attendance"><i class="bi bi-calendar-check"></i> บันทึกการมาเรียน</a>
        <a href="#students" data-page="students"><i class="bi bi-people"></i> ข้อมูลนักเรียน</a>
        <a href="#reports" data-page="reports"><i class="bi bi-file-earmark-bar-graph"></i> รายงาน</a>
        <a href="#teachers" data-page="teachers" data-role="admin,director"><i class="bi bi-person-badge"></i> ครู</a>
        <a href="#users" data-page="users" data-role="admin,director"><i class="bi bi-person-gear"></i> ผู้ใช้งาน</a>
        <a href="#settings" data-page="settings" data-role="admin,director"><i class="bi bi-gear"></i> ตั้งค่า</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-box">
          <div class="user-avatar"><i class="bi bi-person-circle"></i></div>
          <div class="flex-grow-1 overflow-hidden">
            <div class="fw-semibold text-truncate" id="sideUserName">-</div>
            <small class="opacity-75 text-truncate d-block" id="sideUserRole">-</small>
          </div>
        </div>
        <button class="btn btn-outline-light btn-sm w-100 mt-2" onclick="doLogout()">
          <i class="bi bi-box-arrow-right"></i> ออกจากระบบ
        </button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <button class="btn btn-sm btn-light d-md-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <h5 class="mb-0" id="pageTitle">แดชบอร์ด</h5>
        <div class="ms-auto small text-muted" id="topDate"></div>
      </header>
      <div id="content" class="content-area"></div>
    </main>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastBox"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   ✅ SCRIPT_URL — ใส่ URL ของคุณเรียบร้อยแล้ว
   ═══════════════════════════════════════════════════════════════ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzgwk_VnVtIZ3ER4y4tLb_TqGf3lZmBUecfgVuqf9IqPLMak-poQNByZFD80tc9dyBr/exec';

let APP = { token: localStorage.getItem('token') || '', user: null, classes: [] };

async function api(action, data = {}) {
  showLoading(true);
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: APP.token, ...data }),
      redirect: 'follow'
    });
    const json = await res.json();
    if (json.message && json.message.includes('เข้าสู่ระบบ')) doLogout();
    return json;
  } catch (err) {
    toast('เกิดข้อผิดพลาด: ' + err.message, 'danger');
    return { success: false };
  } finally {
    showLoading(false);
  }
}

function showLoading(show) { document.getElementById('loading').classList.toggle('d-none', !show); }

function toast(msg, type = 'success') {
  const id = 't' + Date.now();
  const html = `<div id="${id}" class="toast align-items-center text-bg-${type} border-0" role="alert">
      <div class="d-flex"><div class="toast-body">${msg}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>`;
  document.getElementById('toastBox').insertAdjacentHTML('beforeend', html);
  const el = document.getElementById(id);
  new bootstrap.Toast(el, { delay: 3000 }).show();
  el.addEventListener('hidden.bs.toast', () => el.remove());
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) return toast('กรอกข้อมูลให้ครบ', 'warning');
  const res = await api('login', { username, password });
  if (res.success) {
    APP.token = res.token;
    APP.user = res.user;
    localStorage.setItem('token', APP.token);
    initApp();
  } else {
    const el = document.getElementById('loginError');
    el.textContent = res.message;
    el.classList.remove('d-none');
  }
}

async function doLogout() {
  await api('logout');
  localStorage.removeItem('token');
  APP.token = '';
  APP.user = null;
  document.getElementById('appPage').classList.add('d-none');
  document.getElementById('loginPage').classList.remove('d-none');
  document.getElementById('loginPassword').value = '';
}

async function initApp() {
  const me = await api('getMe');
  if (!me.success) { doLogout(); return; }
  APP.user = me.user;
  document.getElementById('loginPage').classList.add('d-none');
  document.getElementById('appPage').classList.remove('d-none');
  document.getElementById('sideUserName').textContent = APP.user.name;
  document.getElementById('sideUserRole').textContent = roleLabel(APP.user.role) + (APP.user.classes ? ' • ' + APP.user.classes : '');
  document.getElementById('topDate').textContent = new Date().toLocaleDateString('th-TH', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  document.querySelectorAll('.sidebar-nav a[data-role]').forEach(a => {
    const roles = a.dataset.role.split(',');
    if (!roles.includes(APP.user.role)) a.style.display = 'none';
  });
  const cls = await api('getClasses');
  if (cls.success) APP.classes = cls.data;
  window.addEventListener('hashchange', router);
  router();
}

function roleLabel(r) { return { admin: 'ผู้ดูแลระบบ', director: 'ผู้อำนวยการ', teacher: 'ครู' }[r] || r; }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

function router() {
  const page = (location.hash || '#dashboard').slice(1);
  const titleMap = {
    dashboard: 'แดชบอร์ด', attendance: 'บันทึกการมาเรียน', students: 'ข้อมูลนักเรียน',
    reports: 'รายงาน', teachers: 'จัดการครู', users: 'จัดการผู้ใช้งาน', settings: 'ตั้งค่า'
  };
  document.getElementById('pageTitle').textContent = titleMap[page] || page;
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  const content = document.getElementById('content');
  content.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
  switch (page) {
    case 'dashboard': renderDashboard(); break;
    case 'attendance': renderAttendance(); break;
    case 'students': renderStudents(); break;
    case 'reports': renderReports(); break;
    case 'teachers': renderTeachers(); break;
    case 'users': renderUsers(); break;
    case 'settings': renderSettings(); break;
    default: content.innerHTML = '<div class="alert alert-warning">ไม่พบหน้า</div>';
  }
}

async function renderDashboard() {
  const d = await api('getDashboard');
  if (!d.success) return document.getElementById('content').innerHTML = '<div class="alert alert-danger">โหลดข้อมูลไม่ได้</div>';
  const html = `
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card stat-blue"><small>นักเรียนทั้งหมด</small><h3>${d.totalStudents}</h3><i class="bi bi-people fs-3 opacity-50 float-end"></i></div></div>
      <div class="col-6 col-md-3"><div class="stat-card stat-green"><small>มาเรียนวันนี้</small><h3>${d.presentToday}</h3><i class="bi bi-check-circle fs-3 opacity-50 float-end"></i></div></div>
      <div class="col-6 col-md-3"><div class="stat-card stat-red"><small>ขาดวันนี้</small><h3>${d.absentToday}</h3><i class="bi bi-x-circle fs-3 opacity-50 float-end"></i></div></div>
      <div class="col-6 col-md-3"><div class="stat-card stat-orange"><small>บันทึกแล้ววันนี้</small><h3>${d.todayRecorded}</h3><i class="bi bi-pencil-square fs-3 opacity-50 float-end"></i></div></div>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><div class="card"><div class="card-header"><i class="bi bi-bar-chart"></i> จำนวนนักเรียนแยกชั้น</div>
        <div class="card-body">${d.countByClass.map(c => `<div class="d-flex justify-content-between align-items-center mb-2"><span>${c.class}</span><span class="badge bg-primary">${c.count} คน</span></div>`).join('')}</div></div></div>
      <div class="col-md-6"><div class="card"><div class="card-header"><i class="bi bi-info-circle"></i> ข้อมูลระบบ</div>
        <div class="card-body"><p><strong>วันที่:</strong> ${d.date}</p><p><strong>ผู้ใช้:</strong> ${APP.user.name} (${roleLabel(APP.user.role)})</p><p class="mb-0"><strong>ชั้นที่ดูแล:</strong> ${APP.user.classes || 'ทั้งหมด'}</p></div></div></div>
    </div>`;
  document.getElementById('content').innerHTML = html;
}

async function renderAttendance() {
  const userClasses = APP.user.role === 'teacher' ? (APP.user.classes || '').split(',').map(s=>s.trim()).filter(Boolean) : APP.classes;
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('content').innerHTML = `
    <div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-end">
      <div class="col-md-4"><label class="form-label small">ชั้นเรียน</label>
        <select id="attClass" class="form-select"><option value="">-- เลือกชั้น --</option>
          ${userClasses.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select></div>
      <div class="col-md-4"><label class="form-label small">วันที่</label>
        <input type="date" id="attDate" class="form-control" value="${today}"></div>
      <div class="col-md-4"><button class="btn btn-primary w-100" onclick="loadAttendance()"><i class="bi bi-search"></i> โหลดรายชื่อ</button></div>
    </div></div></div>
    <div id="attList"></div>`;
}

async function loadAttendance() {
  const cls = document.getElementById('attClass').value;
  const date = document.getElementById('attDate').value;
  if (!cls || !date) return toast('เลือกชั้นและวันที่', 'warning');
  const res = await api('getAttendance', { class: cls, date });
  if (!res.success) return toast(res.message, 'danger');
  const students = res.data;
  if (!students.length) return document.getElementById('attList').innerHTML = '<div class="alert alert-info">ไม่พบนักเรียนในชั้นนี้</div>';
  document.getElementById('attList').innerHTML = `
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span><i class="bi bi-list-check"></i> ${cls} — ${date} (${students.length} คน)</span>
        <div class="no-print">
          <button class="btn btn-sm btn-success" onclick="saveAllPresent()"><i class="bi bi-check-all"></i> มาทั้งหมด</button>
          <button class="btn btn-sm btn-primary" onclick="saveAttendance()"><i class="bi bi-save"></i> บันทึก</button>
        </div>
      </div>
      <div class="card-body p-0"><div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th style="width:50px">#</th><th>ชื่อ-นามสกุล</th><th style="width:260px" class="text-center">สถานะ</th></tr></thead>
          <tbody>${students.map((s, i) => `
            <tr data-id="${s.id}" data-name="${s.prefix}${s.firstName} ${s.lastName}" data-class="${s.class}">
              <td>${i+1}</td>
              <td>${s.prefix}${s.firstName} ${s.lastName} <small class="text-muted">(${s.nickname || '-'})</small></td>
              <td class="text-center">
                <span class="status-badge sb-ข ${s.todayStatus==='ข'?'active':''}" onclick="setStatus(this)">ข</span>
                <span class="status-badge sb-ล ${s.todayStatus==='ล'?'active':''}" onclick="setStatus(this)">ล</span>
                <span class="status-badge sb-ม ${s.todayStatus==='ม'?'active':''}" onclick="setStatus(this)">ม</span>
                <span class="status-badge sb-ป ${s.todayStatus==='ป'?'active':''}" onclick="setStatus(this)">ป</span>
              </td>
            </tr>`).join('')}</tbody>
        </table>
      </div></div>
      <div class="card-footer text-muted small"><i class="bi bi-info-circle"></i> ข = มา, ล = ลา, ม = ป่วย, ป = ขาด</div>
    </div>`;
}

function setStatus(el) {
  el.parentElement.querySelectorAll('.status-badge').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function saveAllPresent() {
  document.querySelectorAll('#attList tbody tr').forEach(tr => {
    const badges = tr.querySelectorAll('.status-badge');
    badges.forEach(b => b.classList.remove('active'));
    badges[0].classList.add('active');
  });
}

async function saveAttendance() {
  const date = document.getElementById('attDate').value;
  const records = [];
  document.querySelectorAll('#attList tbody tr').forEach(tr => {
    const active = tr.querySelector('.status-badge.active');
    if (!active) return;
    records.push({ studentId: tr.dataset.id, studentName: tr.dataset.name, class: tr.dataset.class, status: active.textContent.trim() });
  });
  if (!records.length) return toast('ยังไม่ได้เลือกสถานะ', 'warning');
  const res = await api('saveAttendance', { date, records });
  toast(res.message, res.success ? 'success' : 'danger');
}

async function renderStudents() {
  document.getElementById('content').innerHTML = `
    <div class="card mb-3"><div class="card-body"><div class="row g-2 align-items-end">
      <div class="col-md-3"><label class="form-label small">ชั้น</label>
        <select id="stuClass" class="form-select"><option value="">ทั้งหมด</option>
          ${APP.classes.map(c => `<option value="${c}">${c}</option>`).join('')}
        </select></div>
      <div class="col-md-5"><label class="form-label small">ค้นหา</label>
        <input id="stuSearch" class="form-control" placeholder="ชื่อ / เลขบัตร / ชื่อเล่น" onkeyup="if(event.key==='Enter')loadStudents()"></div>
      <div class="col-md-2"><button class="btn btn-primary w-100" onclick="loadStudents()"><i class="bi bi-search"></i> ค้นหา</button></div>
      <div class="col-md-2">${['admin','director'].includes(APP.user.role) ? '<button class="btn btn-success w-100" onclick="showStudentForm()"><i class="bi bi-plus-lg"></i> เพิ่ม</button>' : ''}</div>
    </div></div></div>
    <div id="stuList"></div>`;
  loadStudents();
}

async function loadStudents() {
  const cls = document.getElementById('stuClass').value;
  const q = document.getElementById('stuSearch').value;
  const res = await api('getStudents', { class: cls, q });
  if (!res.success) return toast(res.message, 'danger');
  const list = res.data;
  document.getElementById('stuList').innerHTML = `
    <div class="card"><div class="card-header"><i class="bi bi-people"></i> รายชื่อนักเรียน (${list.length} คน)</div>
      <div class="card-body p-0"><div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>#</th><th>ชื่อ-นามสกุล</th><th>ชั้น</th><th>ชื่อเล่น</th><th>เลขบัตร</th><th>ผู้ปกครอง</th><th>เบอร์โทร</th><th class="text-end no-print">จัดการ</th></tr></thead>
          <tbody>${list.length ? list.map((s,i) => `
            <tr><td>${i+1}</td><td>${s.prefix}${s.firstName} ${s.lastName}</td>
              <td><span class="badge bg-primary">${s.class}</span></td><td>${s.nickname || '-'}</td>
              <td>${s.citizenId || '-'}</td><td>${s.guardianName || '-'}</td><td>${s.guardianPhone || '-'}</td>
              <td class="text-end no-print">
                <button class="btn btn-sm btn-outline-info" onclick="viewStudent('${s.id}')"><i class="bi bi-eye"></i></button>
                ${['admin','director'].includes(APP.user.role) ? `
                  <button class="btn btn-sm btn-outline-warning" onclick="showStudentForm('${s.id}')"><i class="bi bi-pencil"></i></button>

async function saveStudent(id) {
  const fields = ['prefix','firstName','lastName','class','nickname','citizenId','ethnicity','nationality','religion','birthDay','birthMonth','birthYear','fatherName','fatherJob','motherName','motherJob','guardianName','guardianJob','guardianRelation','guardianPhone','houseNo','street','soi','moo','subDistrict','district','province','postalCode','photo','status'];
  const s = { id };
  fields.forEach(f => s[f] = document.getElementById('f_' + f).value);
  if (!s.firstName || !s.lastName) return toast('กรอกชื่อ-นามสกุล', 'warning');
  const res = await api(id ? 'updateStudent' : 'addStudent', { student: s });
  toast(res.message, res.success ? 'success' : 'danger');
  if (res.success) { bootstrap.Modal.getInstance(document.getElementById('stuModal')).hide(); loadStudents(); }
}

async function deleteStudent(id, name) {
  if (!confirm('ยืนยันลบ ' + name + '?')) return;
  const res = await api('deleteStudent', { id });
  toast(res.message, res.success ? 'success' : 'danger');
  if (res.success) loadStudents();
}

async function loadDailyStats() {
  const date = document.getElementById('repDate').value;
  const res = await api('getDailyStats', { date });
  if (!res.success) return document.getElementById('dailyReport').innerHTML = '<div class="alert alert-warning">' + res.message + '</div>';
  const d = res.data;
  const classes = ['อ.2','อ.3','ป.1','ป.2','ป.3','ป.4','ป.5','ป.6'];
  document.getElementById('dailyReport').innerHTML = `
    <div class="card"><div class="card-header">สถิติวันที่ ${date}</div>
      <div class="card-body p-0"><table class="table table-bordered mb-0">
        <thead><tr><th>ชั้น</th><th>ทั้งหมด</th><th>มาเรียน</th><th>ร้อยละ</th></tr></thead>
        <tbody>${classes.map((c,i) => {
          const total = d[1+i] || 0;
          const present = d[10+i] || 0;

          return `<tr><td>${c}</td><td>${total}</td><td>${present}</td><td>${pct}%</td></tr>`;
        }).join('')}<tr class="table-primary fw-bold"><td>รวม</td><td>${d[9]||0}</td><td>${d[18]||0}</td><td>${d[19]||0}%</td></tr></tbody>

}

          <td class="text-end">
            <button class="btn btn-sm btn-outline-warning" onclick='showUserForm(${JSON.stringify(u).replace(/'/g, "&#39;")})'><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${u.id}')"><i class="bi bi-trash"></i></button>
          </td></tr>`).join('')}</tbody>
    </table></div></div>`;
}

function showUserForm(u) {
  u = u || { role:'teacher', status:'active' };
  const modal = `
    <div class="modal fade" id="uModal"><div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5>${u.id?'แก้ไข':'เพิ่ม'}ผู้ใช้</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-6"><label class="form-label small">Username *</label><input id="u_username" class="form-control" value="${u.username||''}" ${u.id?'readonly':''}></div>
        <div class="col-md-6"><label class="form-label small">รหัสผ่าน ${u.id?'':'*'}</label><input id="u_password" type="password" class="form-control" placeholder="${u.id?'(เว้นว่าง = ไม่เปลี่ยน)':''}"></div>
        <div class="col-md-6"><label class="form-label small">ชื่อ-สกุล *</label><input id="u_name" class="form-control" value="${u.name||''}"></div>
        <div class="col-md-6"><label class="form-label small">เบอร์โทร</label><input id="u_phone" class="form-control" value="${u.phone||''}"></div>
        <div class="col-md-4"><label class="form-label small">Role</label>
          <select id="u_role" class="form-select">
            <option value="teacher" ${u.role==='teacher'?'selected':''}>ครู</option>
            <option value="director" ${u.role==='director'?'selected':''}>ผู้อำนวยการ</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>ผู้ดูแลระบบ</option>
          </select></div>
        <div class="col-md-4"><label class="form-label small">ตำแหน่ง</label><input id="u_position" class="form-control" value="${u.position||''}"></div>
        <div class="col-md-4"><label class="form-label small">ชั้นที่ดูแล</label><input id="u_classes" class="form-control" value="${u.classes||''}" placeholder="ป.1,ป.2"></div>
        <div class="col-md-6"><label class="form-label small">สถานะ</label>
          <select id="u_status" class="form-select">
            <option value="active" ${u.status==='active'?'selected':''}>ใช้งาน</option>
            <option value="inactive" ${u.status==='inactive'?'selected':''}>ระงับ</option>
          </select></div>
      </div></div>
      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button class="btn btn-primary" onclick="saveUser('${u.id||''}')">บันทึก</button></div>
    </div></div></div>`;
  document.body.insertAdjacentHTML('beforeend', modal);
  new bootstrap.Modal(document.getElementById('uModal')).show();
  document.getElementById('uModal').addEventListener('hidden.bs.modal', () => document.getElementById('uModal').remove());
}

async function saveUser(id) {
  const u = { id,
    username: document.getElementById('u_username').value.trim(),
    password: document.getElementById('u_password').value,
    name: document.getElementById('u_name').value,
    phone: document.getElementById('u_phone').value,
    role: document.getElementById('u_role').value,
    position: document.getElementById('u_position').value,
    classes: document.getElementById('u_classes').value,
    status: document.getElementById('u_status').value
  };
  if (!u.username || !u.name) return toast('กรอกข้อมูล', 'warning');
  if (!id && !u.password) return toast('กรอกรหัสผ่าน', 'warning');
  const res = await api(id ? 'updateUser' : 'addUser', { user: u });
  toast(res.message, res.success ? 'success' : 'danger');
  if (res.success) { bootstrap.Modal.getInstance(document.getElementById('uModal')).hide(); renderUsers(); }
}

async function deleteUser(id) {
  if (!confirm('ยืนยันลบ?')) return;
  const res = await api('deleteUser', { id });
  toast(res.message, res.success ? 'success' : 'danger');
  if (res.success) renderUsers();
}

async function renderSettings() {
  const res = await api('getSettings');
  if (!res.success) return toast(res.message, 'danger');
  const s = res.data;
  document.getElementById('content').innerHTML = `
    <div class="card"><div class="card-header"><i class="bi bi-gear"></i> ตั้งค่าระบบ</div>
      <div class="card-body"><div class="row g-3">
        <div class="col-md-6"><label class="form-label small">ชื่อโรงเรียน</label><input id="s_schoolName" class="form-control" value="${s.schoolName||''}"></div>
        <div class="col-md-3"><label class="form-label small">ปีการศึกษา</label><input id="s_academicYear" class="form-control" value="${s.academicYear||''}"></div>
        <div class="col-md-3"><label class="form-label small">ภาคเรียน</label><input id="s_semester" class="form-control" value="${s.semester||''}"></div>
        <div class="col-md-12"><label class="form-label small">ชั้นเรียน (คั่นด้วย ,)</label><input id="s_classes" class="form-control" value="${s.classes||''}"></div>
        <div class="col-md-3"><label class="form-label small">สถานะ "มา"</label><input id="s_statusPresent" class="form-control" value="${s.statusPresent||'ข'}"></div>
        <div class="col-md-3"><label class="form-label small">สถานะ "ลา"</label><input id="s_statusLeave" class="form-control" value="${s.statusLeave||'ล'}"></div>
        <div class="col-md-3"><label class="form-label small">สถานะ "ป่วย"</label><input id="s_statusSick" class="form-control" value="${s.statusSick||'ม'}"></div>
        <div class="col-md-3"><label class="form-label small">สถานะ "ขาด"</label><input id="s_statusAbsent" class="form-control" value="${s.statusAbsent||'ป'}"></div>
      </div>
      <div class="mt-4"><button class="btn btn-primary" onclick="saveSettings()"><i class="bi bi-save"></i> บันทึก</button></div>
      </div>
    </div>
    <div class="card mt-3"><div class="card-header"><i class="bi bi-key"></i> เปลี่ยนรหัสผ่าน</div>
      <div class="card-body"><div class="row g-3">
        <div class="col-md-4"><input id="pwd_old" type="password" class="form-control" placeholder="รหัสเดิม"></div>
        <div class="col-md-4"><input id="pwd_new" type="password" class="form-control" placeholder="รหัสใหม่"></div>
        <div class="col-md-4"><button class="btn btn-warning w-100" onclick="changePassword()">เปลี่ยนรหัส</button></div>
      </div></div>
    </div>`;
}

async function saveSettings() {
  const keys = ['schoolName','academicYear','semester','classes','statusPresent','statusLeave','statusSick','statusAbsent'];
  const settings = {};
  keys.forEach(k => settings[k] = document.getElementById('s_' + k).value);
  const res = await api('updateSettings', { settings });
  toast(res.message, res.success ? 'success' : 'danger');
}

async function changePassword() {
  const oldPassword = document.getElementById('pwd_old').value;
  const newPassword = document.getElementById('pwd_new').value;
  if (!oldPassword || !newPassword) return toast('กรอกให้ครบ', 'warning');
  const res = await api('changePassword', { oldPassword, newPassword });
  toast(res.message, res.success ? 'success' : 'danger');
  if (res.success) { document.getElementById('pwd_old').value = ''; document.getElementById('pwd_new').value = ''; }
}

if (APP.token) { initApp(); }
else { document.getElementById('loginPage').classList.remove('d-none'); }
</script>
</body>
</html>
